<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: transparent;
  font-family: -apple-system, sans-serif;
  cursor: move;
}
#result {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
}
#toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.82);
  color: #fff;
  padding: 8px 18px;
  border-radius: 9px;
  font: 500 13px -apple-system, "PingFang SC", sans-serif;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.18s ease;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="result"></canvas>
<div id="toast"></div>
<!-- 和全屏浮层用同一套渲染：按段折行、字号跟原文、先擦后画 -->
<script src="overlay.js"></script>
<script>
  // 区域浮层额外支持 Esc 关闭
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.api.close(); });
</script>
</body>
</html>
