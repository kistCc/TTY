<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TTY</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; }
    body {
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
    }
    #card {
      background: rgba(30, 30, 46, 0.97);
      border: 1px solid #45475a;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    #bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid #313244;
      -webkit-app-region: drag;
    }
    #dot { width: 7px; height: 7px; border-radius: 50%; background: #cba6f7; flex: none; }
    #route { font-size: 11px; color: #6c7086; letter-spacing: .2px; }
    #spacer { flex: 1; }
    #close {
      -webkit-app-region: no-drag;
      font-size: 15px; line-height: 1; color: #6c7086;
      cursor: pointer; padding: 2px 4px; border-radius: 4px;
    }
    #close:hover { color: #f38ba8; background: #313244; }

    #source {
      padding: 9px 14px;
      font-size: 12px;
      line-height: 1.5;
      color: #7f849c;
      max-height: 88px;
      overflow-y: auto;
      border-bottom: 1px solid #313244;
      -webkit-user-select: text;
      user-select: text;
      word-break: break-word;
      white-space: pre-wrap;
    }
    #result {
      padding: 12px 14px;
      font-size: 15px;
      line-height: 1.55;
      color: #cdd6f4;
      max-height: 300px;
      overflow-y: auto;
      -webkit-user-select: text;
      user-select: text;
      word-break: break-word;
      white-space: pre-wrap;
      flex: 1;
    }
    #result.pending { color: #6c7086; font-size: 13px; }
    #result.error { color: #f38ba8; font-size: 13px; }

    #axhint {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(249, 226, 175, 0.08);
      border-top: 1px solid #313244;
      font-size: 11px;
      color: #f9e2af;
      line-height: 1.45;
    }
    #axhint.show { display: flex; }
    #axopen {
      -webkit-app-region: no-drag;
      margin-left: auto;
      flex: none;
      padding: 3px 10px;
      background: #f9e2af;
      color: #1e1e2e;
      border: none;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    #axopen:hover { background: #fae3b0; }

    #foot {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-top: 1px solid #313244;
    }
    #copy {
      -webkit-app-region: no-drag;
      padding: 4px 12px;
      background: #cba6f7;
      color: #1e1e2e;
      border: none;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    #copy:hover { background: #b4befe; }
    #copy:disabled { background: #45475a; color: #6c7086; cursor: default; }
    #tip { font-size: 10px; color: #585b70; margin-left: auto; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ''; } 25% { content: '·'; }
      50% { content: '··'; } 75% { content: '···'; }
    }
  </style>
</head>
<body>
  <div id="card">
    <div id="bar">
      <span id="dot"></span>
      <span id="route"></span>
      <span id="spacer"></span>
      <span id="close">×</span>
    </div>
    <div id="source"></div>
    <div id="result" class="pending"></div>
    <div id="axhint">
      <span id="axtext"></span>
      <button id="axopen"></button>
    </div>
    <div id="foot">
      <button id="copy" disabled></button>
      <span id="tip"></span>
    </div>
  </div>
  <script src="keys.js"></script>
  <script src="quick.js"></script>
</body>
</html>
